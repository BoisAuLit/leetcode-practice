<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 1446" width="1550" height="1446" role="img" aria-label="Graph algorithm decision tree 图论算法选择决策树: from what the problem asks, through conditions, to the algorithm and its complexity" style="color:#1f2937;font-family:'Helvetica Neue', Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;font-size:13px">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect width="1550" height="1446" fill="#ffffff"/>
<text x="775.0" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="currentColor">Graph Algorithm Decision Tree  图论算法选择决策树</text>
<text x="775.0" y="58" text-anchor="middle" font-size="12" fill="#6b7280">Read left to right: what is asked → extra condition → algorithm (time complexity on the right).  从左往右读:题目在问什么 → 附加条件 → 算法(右侧是时间复杂度)</text>
<text x="775.0" y="76" text-anchor="middle" font-size="11.5" fill="#6b7280">V = number of nodes 点数, E = number of edges 边数.  Gray line under each condition = 概念注释</text>
<rect x="30" y="728.5" width="200" height="52" rx="26" fill="#f3f4f6" stroke="currentColor" stroke-width="1.5"/>
<text x="130.0" y="751.5" text-anchor="middle" font-weight="700" fill="currentColor">What is the problem asking?</text>
<text x="130.0" y="769.5" text-anchor="middle" font-size="12" fill="#374151">题目在问什么?</text>
<path d="M230,754.5 H255.0 V234.0 H280" fill="none" stroke="currentColor" stroke-width="1.3"/>
<rect x="280" y="209.0" width="350" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="455.0" y="231.0" text-anchor="middle" font-weight="700" fill="currentColor">Reachability / components / grouping</text>
<text x="455.0" y="249.0" text-anchor="middle" font-size="12" fill="#374151">能不能到 / 有几块 / 怎么分组</text>
<path d="M630,234.0 H660.0 V114.0 H690" fill="none" stroke="#2563eb" stroke-width="1.3"/>
<rect x="690" y="90.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="110.0" fill="currentColor" font-size="12.5" font-weight="600">Static graph</text>
<text x="702" y="128.0" fill="#6b7280" font-size="11">静态图:边一开始就全部给定,之后不再变化</text>
<path d="M1080,114.0 H1138" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="97.0" width="380" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="1152" y="119.0" fill="currentColor" font-weight="700">DFS / BFS</text>
<text x="1508" y="119.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(V+E)</text>
<path d="M630,234.0 H660.0 V174.0 H690" fill="none" stroke="#2563eb" stroke-width="1.3"/>
<rect x="690" y="150.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="170.0" fill="currentColor" font-size="12.5" font-weight="600">Edges added one by one, queried repeatedly</text>
<text x="702" y="188.0" fill="#6b7280" font-size="11">动态加边:边一条条到来,每加一条就要答是否连通</text>
<path d="M1080,174.0 H1138" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="157.0" width="380" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="1152" y="179.0" fill="currentColor" font-weight="700">Union-Find 并查集</text>
<text x="1508" y="179.0" text-anchor="end" fill="#4b5563" font-size="11.5">≈ O(1) per op</text>
<path d="M630,234.0 H660.0 V234.0 H690" fill="none" stroke="#2563eb" stroke-width="1.3"/>
<rect x="690" y="210.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="230.0" fill="currentColor" font-size="12.5" font-weight="600">Undirected graph: has a cycle?</text>
<text x="702" y="248.0" fill="#6b7280" font-size="11">无向图有没有环:union 时两点已连通 = 成环</text>
<path d="M1080,234.0 H1138" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="217.0" width="380" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="1152" y="239.0" fill="currentColor" font-weight="700">Union-Find (union returns False)</text>
<text x="1508" y="239.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(E·α)</text>
<path d="M630,234.0 H660.0 V294.0 H690" fill="none" stroke="#2563eb" stroke-width="1.3"/>
<rect x="690" y="270.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="290.0" fill="currentColor" font-size="12.5" font-weight="600">Which edge's removal disconnects the graph?</text>
<text x="702" y="308.0" fill="#6b7280" font-size="11">桥 bridge:删掉它,图就断成两块</text>
<path d="M1080,294.0 H1138" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="277.0" width="380" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="1152" y="299.0" fill="currentColor" font-weight="700">Tarjan bridges 求桥</text>
<text x="1508" y="299.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(V+E)</text>
<path d="M630,234.0 H660.0 V354.0 H690" fill="none" stroke="#2563eb" stroke-width="1.3"/>
<rect x="690" y="330.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="350.0" fill="currentColor" font-size="12.5" font-weight="600">Split into 2 groups, no edge inside a group</text>
<text x="702" y="368.0" fill="#6b7280" font-size="11">二分图 bipartite:每条边都跨两组,有奇环则不行</text>
<path d="M1080,354.0 H1138" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="337.0" width="380" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="1152" y="359.0" fill="currentColor" font-weight="700">Bipartite coloring 二分图染色</text>
<text x="1508" y="359.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(V+E)</text>
<path d="M230,754.5 H255.0 V626.0 H280" fill="none" stroke="currentColor" stroke-width="1.3"/>
<rect x="280" y="601.0" width="350" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="455.0" y="623.0" text-anchor="middle" font-weight="700" fill="currentColor">Shortest path A → B (min steps / min cost)</text>
<text x="455.0" y="641.0" text-anchor="middle" font-size="12" fill="#374151">A 到 B 最少步数 / 最小代价</text>
<path d="M630,626.0 H660.0 V446.0 H690" fill="none" stroke="#16a34a" stroke-width="1.3"/>
<rect x="690" y="422.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="442.0" fill="currentColor" font-size="12.5" font-weight="600">Unweighted (all edges cost the same)</text>
<text x="702" y="460.0" fill="#6b7280" font-size="11">无权:每条边代价相同,只数步数</text>
<path d="M1080,446.0 H1138" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="429.0" width="380" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="1152" y="451.0" fill="currentColor" font-weight="700">BFS</text>
<text x="1508" y="451.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(V+E)</text>
<path d="M630,626.0 H660.0 V506.0 H690" fill="none" stroke="#16a34a" stroke-width="1.3"/>
<rect x="690" y="482.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="502.0" fill="currentColor" font-size="12.5" font-weight="600">Edge weights only 0 or 1</text>
<text x="702" y="520.0" fill="#6b7280" font-size="11">边权只有 0 和 1</text>
<path d="M1080,506.0 H1138" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="489.0" width="380" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="1152" y="511.0" fill="currentColor" font-weight="700">0-1 BFS (deque 双端队列)</text>
<text x="1508" y="511.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(V+E)</text>
<path d="M630,626.0 H660.0 V566.0 H690" fill="none" stroke="#16a34a" stroke-width="1.3"/>
<rect x="690" y="542.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="562.0" fill="currentColor" font-size="12.5" font-weight="600">Non-negative weights, any size</text>
<text x="702" y="580.0" fill="#6b7280" font-size="11">边权非负,大小任意</text>
<path d="M1080,566.0 H1138" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="549.0" width="380" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="1152" y="571.0" fill="currentColor" font-weight="700">Dijkstra (heap 堆)</text>
<text x="1508" y="571.0" text-anchor="end" fill="#4b5563" font-size="11.5">O((V+E) log V)</text>
<path d="M630,626.0 H660.0 V626.0 H690" fill="none" stroke="#16a34a" stroke-width="1.3"/>
<rect x="690" y="602.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="622.0" fill="currentColor" font-size="12.5" font-weight="600">Minimize the largest edge on the path</text>
<text x="702" y="640.0" fill="#6b7280" font-size="11">最小瓶颈 minimax:路径上最大的那条边尽量小</text>
<path d="M1080,626.0 H1138" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="609.0" width="380" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="1152" y="631.0" fill="currentColor" font-weight="700">Dijkstra with max() relax, or MST</text>
<text x="1508" y="631.0" text-anchor="end" fill="#4b5563" font-size="11.5">same as above</text>
<path d="M630,626.0 H660.0 V686.0 H690" fill="none" stroke="#16a34a" stroke-width="1.3"/>
<rect x="690" y="662.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="682.0" fill="currentColor" font-size="12.5" font-weight="600">Negative edge weights exist</text>
<text x="702" y="700.0" fill="#6b7280" font-size="11">有负权边:Dijkstra 会算错</text>
<path d="M1080,686.0 H1138" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="669.0" width="380" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="1152" y="691.0" fill="currentColor" font-weight="700">Bellman-Ford</text>
<text x="1508" y="691.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(V·E)</text>
<path d="M630,626.0 H660.0 V746.0 H690" fill="none" stroke="#16a34a" stroke-width="1.3"/>
<rect x="690" y="722.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="742.0" fill="currentColor" font-size="12.5" font-weight="600">At most k edges (e.g. k stops)</text>
<text x="702" y="760.0" fill="#6b7280" font-size="11">最多经过 k 条边,如最多 k 次转机</text>
<path d="M1080,746.0 H1138" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="729.0" width="380" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="1152" y="751.0" fill="currentColor" font-weight="700">Bellman-Ford, k rounds w/ snapshot 快照</text>
<text x="1508" y="751.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(k·E)</text>
<path d="M630,626.0 H660.0 V806.0 H690" fill="none" stroke="#16a34a" stroke-width="1.3"/>
<rect x="690" y="782.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="802.0" fill="currentColor" font-size="12.5" font-weight="600">All pairs, V ≤ ~400</text>
<text x="702" y="820.0" fill="#6b7280" font-size="11">所有点对之间,点数几百以内</text>
<path d="M1080,806.0 H1138" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="789.0" width="380" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="1152" y="811.0" fill="currentColor" font-weight="700">Floyd-Warshall</text>
<text x="1508" y="811.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(V³)</text>
<path d="M230,754.5 H255.0 V958.0 H280" fill="none" stroke="currentColor" stroke-width="1.3"/>
<rect x="280" y="933.0" width="350" height="50" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="455.0" y="955.0" text-anchor="middle" font-weight="700" fill="currentColor">Connect all nodes at min total cost (MST)</text>
<text x="455.0" y="973.0" text-anchor="middle" font-size="12" fill="#374151">把所有点连通、总代价最少(最小生成树)</text>
<path d="M630,958.0 H660.0 V898.0 H690" fill="none" stroke="#ea580c" stroke-width="1.3"/>
<rect x="690" y="874.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="894.0" fill="currentColor" font-size="12.5" font-weight="600">Edge list given / sparse (E ≈ V)</text>
<text x="702" y="912.0" fill="#6b7280" font-size="11">给边列表;稀疏 sparse:边数和点数同量级</text>
<path d="M1080,898.0 H1138" fill="none" stroke="#ea580c" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="881.0" width="380" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="1152" y="903.0" fill="currentColor" font-weight="700">Kruskal (sort + Union-Find)</text>
<text x="1508" y="903.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(E log E)</text>
<path d="M630,958.0 H660.0 V958.0 H690" fill="none" stroke="#ea580c" stroke-width="1.3"/>
<rect x="690" y="934.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="954.0" fill="currentColor" font-size="12.5" font-weight="600">Points given / dense (E ≈ V²)</text>
<text x="702" y="972.0" fill="#6b7280" font-size="11">给坐标点;稠密 dense:任意两点都有边</text>
<path d="M1080,958.0 H1138" fill="none" stroke="#ea580c" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="941.0" width="380" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="1152" y="963.0" fill="currentColor" font-weight="700">Prim, array version 数组版</text>
<text x="1508" y="963.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(V²)</text>
<path d="M630,958.0 H660.0 V1018.0 H690" fill="none" stroke="#ea580c" stroke-width="1.3"/>
<rect x="690" y="994.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="1014.0" fill="currentColor" font-size="12.5" font-weight="600">Each node can 'build its own' (standalone cost)</text>
<text x="702" y="1032.0" fill="#6b7280" font-size="11">每个点可自建,有独立代价,如自己打井</text>
<path d="M1080,1018.0 H1138" fill="none" stroke="#ea580c" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="1001.0" width="380" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="1152" y="1023.0" fill="currentColor" font-weight="700">Virtual source + MST 虚拟源点</text>
<text x="1508" y="1023.0" text-anchor="end" fill="#4b5563" font-size="11.5">same as above</text>
<path d="M230,754.5 H255.0 V1200.0 H280" fill="none" stroke="currentColor" stroke-width="1.3"/>
<rect x="280" y="1175.0" width="350" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="455.0" y="1197.0" text-anchor="middle" font-weight="700" fill="currentColor">Directed graph: order / dependency / cycle</text>
<text x="455.0" y="1215.0" text-anchor="middle" font-size="12" fill="#374151">有向图的顺序 / 依赖 / 环</text>
<path d="M630,1200.0 H660.0 V1110.0 H690" fill="none" stroke="#7c3aed" stroke-width="1.3"/>
<rect x="690" y="1086.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="1106.0" fill="currentColor" font-size="12.5" font-weight="600">Order of tasks / can all be finished?</text>
<text x="702" y="1124.0" fill="#6b7280" font-size="11">先后顺序、能否全部完成,如课程表</text>
<path d="M1080,1110.0 H1138" fill="none" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="1093.0" width="380" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1152" y="1115.0" fill="currentColor" font-weight="700">Topological sort (Kahn) 拓扑排序</text>
<text x="1508" y="1115.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(V+E)</text>
<path d="M630,1200.0 H660.0 V1170.0 H690" fill="none" stroke="#7c3aed" stroke-width="1.3"/>
<rect x="690" y="1146.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="1166.0" fill="currentColor" font-size="12.5" font-weight="600">Directed graph: has a cycle?</text>
<text x="702" y="1184.0" fill="#6b7280" font-size="11">有向图有没有环</text>
<path d="M1080,1170.0 H1138" fill="none" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="1153.0" width="380" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1152" y="1175.0" fill="currentColor" font-weight="700">3-color DFS or topo sort 三色 DFS</text>
<text x="1508" y="1175.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(V+E)</text>
<path d="M630,1200.0 H660.0 V1230.0 H690" fill="none" stroke="#7c3aed" stroke-width="1.3"/>
<rect x="690" y="1206.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="1226.0" fill="currentColor" font-size="12.5" font-weight="600">Longest path / path count on a DAG</text>
<text x="702" y="1244.0" fill="#6b7280" font-size="11">DAG 有向无环图上的最长路 / 路径计数</text>
<path d="M1080,1230.0 H1138" fill="none" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="1213.0" width="380" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1152" y="1235.0" fill="currentColor" font-weight="700">Topological sort + DP</text>
<text x="1508" y="1235.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(V+E)</text>
<path d="M630,1200.0 H660.0 V1290.0 H690" fill="none" stroke="#7c3aed" stroke-width="1.3"/>
<rect x="690" y="1266.0" width="390" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="702" y="1286.0" fill="currentColor" font-size="12.5" font-weight="600">Use every edge exactly once (Eulerian)</text>
<text x="702" y="1304.0" fill="#6b7280" font-size="11">一笔画:每条边恰好走一次</text>
<path d="M1080,1290.0 H1138" fill="none" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1140" y="1273.0" width="380" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1152" y="1295.0" fill="currentColor" font-weight="700">Hierholzer (Eulerian path 欧拉路径)</text>
<text x="1508" y="1295.0" text-anchor="end" fill="#4b5563" font-size="11.5">O(E)</text>
<text x="30" y="1388" fill="#4b5563" font-size="11.5">Memory line 记忆线: BFS → 0-1 BFS → Dijkstra → Bellman-Ford → Floyd differ only in the ORDER of relaxing 只差松弛的顺序;  Dijkstra vs Prim differ only in relax: d + w (累计) vs w (单条边).</text>
<text x="30" y="1406" fill="#4b5563" font-size="11.5">Glossary 术语: relax 松弛 = if going through u makes dist[v] smaller, update it 经过 u 更近就更新;  DAG = directed acyclic graph 有向无环图;  sparse 稀疏 E ≈ V, dense 稠密 E ≈ V²;  static 静态 = edges fixed before queries, online 动态 = edges arrive during queries.</text>
