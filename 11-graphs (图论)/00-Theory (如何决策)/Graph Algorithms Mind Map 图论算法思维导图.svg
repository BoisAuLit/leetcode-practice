<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1732 1717" width="1732" height="1717" role="img" aria-label="Mind map of graph algorithms for interviews: traversal, shortest path, connectivity, spanning tree, directed graphs, strategy, each algorithm with idea, use, limits, complexity and LeetCode problems" style="color:#1f2937;font-family:'Helvetica Neue', Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;font-size:11.2px">
<rect width="1732" height="1717" fill="#ffffff"/>
<text x="866.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">Graph Algorithms Mind Map · 图论算法全景思维导图</text>
<text x="866.0" y="54" text-anchor="middle" font-size="12" fill="#6b7280">Each card: Idea 核心 · Use 适用 · Not 限制 · Pitfall 坑 · LeetCode numbers. Templates are in the handbook, not here.  V = nodes 点数, E = edges 边数.</text>
<path d="M986.0,868.5 C1016.0,868.5 1016.0,240.5 1046.0,240.5" fill="none" stroke="#0d9488" stroke-width="1.6"/>
<rect x="1046.0" y="216.5" width="250" height="48" rx="24" fill="#0d9488" />
<text x="1171.0" y="245.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Traversal 遍历</text>
<path d="M1296.0,240.5 C1324.0,240.5 1324.0,161.8 1352.0,161.8" fill="none" stroke="#0d9488" stroke-width="1.6"/>
<rect x="1352.0" y="90.0" width="350" height="143.5" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
<text x="1362.0" y="111.0" font-size="13" font-weight="700" fill="currentColor">BFS · O(V+E)</text>
<text x="1362.0" y="130.2" fill="#374151">Idea 核心: queue, level by level; first arrival = fewest</text>
<text x="1362.0" y="145.7" fill="#374151">steps</text>
<text x="1362.0" y="161.2" fill="#374151">Use 适用: unweighted shortest path, multi-source 多源, state</text>
<text x="1362.0" y="176.7" fill="#374151">graphs 状态图</text>
<text x="1362.0" y="192.2" fill="#374151">Not 限制: weighted edges → 0-1 BFS or Dijkstra</text>
<text x="1362.0" y="207.7" fill="#374151">Pitfall 坑: mark visited on enqueue 入队时标记</text>
<text x="1362.0" y="223.2" fill="#374151">LC: 127, 752, 994, 542, 1091, 773, 1293</text>
<path d="M1296.0,240.5 C1324.0,240.5 1324.0,319.2 1352.0,319.2" fill="none" stroke="#0d9488" stroke-width="1.6"/>
<rect x="1352.0" y="247.5" width="350" height="143.5" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
<text x="1362.0" y="268.5" font-size="13" font-weight="700" fill="currentColor">DFS · O(V+E)</text>
<text x="1362.0" y="287.7" fill="#374151">Idea: go deep, then back up; recursion or explicit stack</text>
<text x="1362.0" y="303.2" fill="#374151">显式栈</text>
<text x="1362.0" y="318.7" fill="#374151">Use: components 连通块, reachability, enumerate paths, flood</text>
<text x="1362.0" y="334.2" fill="#374151">fill, backtracking 回溯</text>
<text x="1362.0" y="349.7" fill="#374151">Not: shortest path (no guarantee 不保证最短)</text>
<text x="1362.0" y="365.2" fill="#374151">Pitfall: depth 10⁵ → explicit stack</text>
<text x="1362.0" y="380.7" fill="#374151">LC: 200, 695, 547, 133, 797, 130, 417, 329</text>
<path d="M986.0,868.5 C1016.0,868.5 1016.0,678.8 1046.0,678.8" fill="none" stroke="#16a34a" stroke-width="1.6"/>
<rect x="1046.0" y="654.8" width="250" height="48" rx="24" fill="#16a34a" />
<text x="1171.0" y="683.8" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Shortest path 最短路</text>
<path d="M1296.0,678.8 C1324.0,678.8 1324.0,465.8 1352.0,465.8" fill="none" stroke="#16a34a" stroke-width="1.6"/>
<rect x="1352.0" y="425.0" width="350" height="81.5" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="1362.0" y="446.0" font-size="13" font-weight="700" fill="currentColor">0-1 BFS · O(V+E)</text>
<text x="1362.0" y="465.2" fill="#374151">Idea: deque; weight 0 → push front 队头, 1 → push back 队尾</text>
<text x="1362.0" y="480.7" fill="#374151">Use: edge weights only 0 / 1 (grid: free move vs. costly move)</text>
<text x="1362.0" y="496.2" fill="#374151">LC: 1368, 2290</text>
<path d="M1296.0,678.8 C1324.0,678.8 1324.0,592.2 1352.0,592.2" fill="none" stroke="#16a34a" stroke-width="1.6"/>
<rect x="1352.0" y="520.5" width="350" height="143.5" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="1362.0" y="541.5" font-size="13" font-weight="700" fill="currentColor">Dijkstra · O((V+E) log V), array O(V²)</text>
<text x="1362.0" y="560.7" fill="#374151">Idea: heap pops the closest unsettled node, relax neighbors;</text>
<text x="1362.0" y="576.2" fill="#374151">lazy deletion 懒删除</text>
<text x="1362.0" y="591.7" fill="#374151">Use: non-negative weights 非负; change relax line → minimax /</text>
<text x="1362.0" y="607.2" fill="#374151">maximin / probability; add state to nodes 带状态</text>
<text x="1362.0" y="622.7" fill="#374151">Not: negative edges ✗; edge-count limits are awkward</text>
<text x="1362.0" y="638.2" fill="#374151">Pitfall: forgetting `if d &gt; dist[u]: continue`</text>
<text x="1362.0" y="653.7" fill="#374151">LC: 743, 1631, 778, 1514, 1976, 2577, 1334</text>
<path d="M1296.0,678.8 C1324.0,678.8 1324.0,742.0 1352.0,742.0" fill="none" stroke="#16a34a" stroke-width="1.6"/>
<rect x="1352.0" y="678.0" width="350" height="128.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="1362.0" y="699.0" font-size="13" font-weight="700" fill="currentColor">Bellman-Ford · O(V·E)</text>
<text x="1362.0" y="718.2" fill="#374151">Idea: relax ALL edges, V−1 rounds; round V still relaxes →</text>
<text x="1362.0" y="733.7" fill="#374151">negative cycle 负环</text>
<text x="1362.0" y="749.2" fill="#374151">Use: negative weights 负权; at most k edges (k rounds +</text>
<text x="1362.0" y="764.7" fill="#374151">snapshot 快照)</text>
<text x="1362.0" y="780.2" fill="#374151">Not: large graphs — too slow</text>
<text x="1362.0" y="795.7" fill="#374151">LC: 787</text>
<path d="M1296.0,678.8 C1324.0,678.8 1324.0,876.2 1352.0,876.2" fill="none" stroke="#16a34a" stroke-width="1.6"/>
<rect x="1352.0" y="820.0" width="350" height="112.5" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="1362.0" y="841.0" font-size="13" font-weight="700" fill="currentColor">Floyd-Warshall · O(V³)</text>
<text x="1362.0" y="860.2" fill="#374151">Idea: DP over intermediate node k 中转点 — k must be the</text>
<text x="1362.0" y="875.7" fill="#374151">OUTERMOST loop</text>
<text x="1362.0" y="891.2" fill="#374151">Use: all pairs 全源, V ≤ ~400; transitive closure 传递闭包</text>
<text x="1362.0" y="906.7" fill="#374151">(or / and)</text>
<text x="1362.0" y="922.2" fill="#374151">LC: 1334, 1462, 2976</text>
<path d="M986.0,868.5 C1016.0,868.5 1016.0,1306.8 1046.0,1306.8" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1046.0" y="1282.8" width="250" height="48" rx="24" fill="#2563eb" />
<text x="1171.0" y="1311.8" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Connectivity 连通性</text>
<path d="M1296.0,1306.8 C1324.0,1306.8 1324.0,1038.2 1352.0,1038.2" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1352.0" y="966.5" width="350" height="143.5" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="1362.0" y="987.5" font-size="13" font-weight="700" fill="currentColor">Union-Find 并查集 · ≈ O(1) per op</text>
<text x="1362.0" y="1006.7" fill="#374151">Idea: find = walk to root 根; union = hang one root under</text>
<text x="1362.0" y="1022.2" fill="#374151">another; path compression 路径压缩 + union by size</text>
<text x="1362.0" y="1037.7" fill="#374151">Use: edges arriving online 动态加边, count components,</text>
<text x="1362.0" y="1053.2" fill="#374151">undirected cycle (union → False), grouping, offline queries</text>
<text x="1362.0" y="1068.7" fill="#374151">离线</text>
<text x="1362.0" y="1084.2" fill="#374151">Not: edge deletion (reverse the process); gives no path</text>
<text x="1362.0" y="1099.7" fill="#374151">LC: 547, 684, 721, 990, 1319, 1579, 1697</text>
<path d="M1296.0,1306.8 C1324.0,1306.8 1324.0,1188.0 1352.0,1188.0" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1352.0" y="1124.0" width="350" height="128.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="1362.0" y="1145.0" font-size="13" font-weight="700" fill="currentColor">Cycle detection 环检测 · O(V+E)</text>
<text x="1362.0" y="1164.2" fill="#374151">Undirected 无向: Union-Find, union returns False</text>
<text x="1362.0" y="1179.7" fill="#374151">Directed 有向: 3-color DFS 三色 (gray neighbor = cycle), or</text>
<text x="1362.0" y="1195.2" fill="#374151">topo sort outputs &lt; V nodes</text>
<text x="1362.0" y="1210.7" fill="#374151">Pitfall: plain `visited` mistakes merge points for cycles</text>
<text x="1362.0" y="1226.2" fill="#374151">in directed graphs</text>
<text x="1362.0" y="1241.7" fill="#374151">LC: 207, 684, 261, 802</text>
<path d="M1296.0,1306.8 C1324.0,1306.8 1324.0,1322.2 1352.0,1322.2" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1352.0" y="1266.0" width="350" height="112.5" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="1362.0" y="1287.0" font-size="13" font-weight="700" fill="currentColor">Bipartite 二分图 · O(V+E)</text>
<text x="1362.0" y="1306.2" fill="#374151">Idea: 2-color by BFS/DFS; a conflict = odd cycle 奇环</text>
<text x="1362.0" y="1321.7" fill="#374151">Use: split into two groups with no edge inside a group</text>
<text x="1362.0" y="1337.2" fill="#374151">Pitfall: start from every uncolored node (graph may be</text>
<text x="1362.0" y="1352.7" fill="#374151">disconnected)</text>
<text x="1362.0" y="1368.2" fill="#374151">LC: 785, 886</text>
<path d="M1296.0,1306.8 C1324.0,1306.8 1324.0,1456.5 1352.0,1456.5" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1352.0" y="1392.5" width="350" height="128.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="1362.0" y="1413.5" font-size="13" font-weight="700" fill="currentColor">Tarjan bridges 求桥 · O(V+E)</text>
<text x="1362.0" y="1432.7" fill="#374151">Idea: disc / low timestamps; low[v] &gt; disc[u] → edge (u, v) is</text>
<text x="1362.0" y="1448.2" fill="#374151">a bridge 桥</text>
<text x="1362.0" y="1463.7" fill="#374151">Use: which edge's removal disconnects the graph; critical</text>
<text x="1362.0" y="1479.2" fill="#374151">connections</text>
<text x="1362.0" y="1494.7" fill="#374151">Pitfall: skip the edge back to parent; deep recursion</text>
<text x="1362.0" y="1510.2" fill="#374151">LC: 1192</text>
<path d="M1296.0,1306.8 C1324.0,1306.8 1324.0,1590.8 1352.0,1590.8" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1352.0" y="1534.5" width="350" height="112.5" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="1362.0" y="1555.5" font-size="13" font-weight="700" fill="currentColor">SCC Kosaraju 强连通分量 · O(V+E)</text>
<text x="1362.0" y="1574.7" fill="#374151">Idea: DFS finish order → second DFS on the reversed graph</text>
<text x="1362.0" y="1590.2" fill="#374151">反图</text>
<text x="1362.0" y="1605.7" fill="#374151">Use: mutually reachable groups in a directed graph; condense</text>
<text x="1362.0" y="1621.2" fill="#374151">to a DAG</text>
<text x="1362.0" y="1636.7" fill="#374151">Rare in interviews 面试少见 — know the idea</text>
<path d="M746.0,868.5 C716.0,868.5 716.0,453.5 686.0,453.5" fill="none" stroke="#ea580c" stroke-width="1.6"/>
<rect x="436.0" y="429.5" width="250" height="48" rx="24" fill="#ea580c" />
<text x="561.0" y="458.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Spanning tree 生成树 (MST)</text>
<path d="M436.0,453.5 C408.0,453.5 408.0,382.5 380.0,382.5" fill="none" stroke="#ea580c" stroke-width="1.6"/>
<rect x="30.0" y="326.2" width="350" height="112.5" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
<text x="40.0" y="347.2" font-size="13" font-weight="700" fill="currentColor">Kruskal · O(E log E)</text>
<text x="40.0" y="366.4" fill="#374151">Idea: sort edges; take an edge iff union succeeds (no cycle)</text>
<text x="40.0" y="381.9" fill="#374151">— cut property 切割性质</text>
<text x="40.0" y="397.4" fill="#374151">Use: edge list given, sparse 稀疏; critical / pseudo-critical</text>
<text x="40.0" y="412.9" fill="#374151">edges; offline threshold queries</text>
<text x="40.0" y="428.4" fill="#374151">LC: 1135, 1489, 1697</text>
<path d="M436.0,453.5 C408.0,453.5 408.0,516.8 380.0,516.8" fill="none" stroke="#ea580c" stroke-width="1.6"/>
<rect x="30.0" y="452.8" width="350" height="128.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
<text x="40.0" y="473.8" font-size="13" font-weight="700" fill="currentColor">Prim · heap O(E log V), array O(V²)</text>
<text x="40.0" y="492.9" fill="#374151">Idea: grow one tree; absorb the closest outside node;</text>
<text x="40.0" y="508.4" fill="#374151">min_dist = single edge w, NOT d + w</text>
<text x="40.0" y="524.0" fill="#374151">Use: dense / coordinate points 坐标点 → array version;</text>
<text x="40.0" y="539.5" fill="#374151">virtual source 虚拟源点 for 'build your own' cost</text>
<text x="40.0" y="555.0" fill="#374151">Pitfall: writing d + w turns it into Dijkstra</text>
<text x="40.0" y="570.5" fill="#374151">LC: 1584, 1168</text>
<path d="M746.0,868.5 C716.0,868.5 716.0,828.5 686.0,828.5" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="436.0" y="804.5" width="250" height="48" rx="24" fill="#7c3aed" />
<text x="561.0" y="833.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Directed graph 有向图</text>
<path d="M436.0,828.5 C408.0,828.5 408.0,694.2 380.0,694.2" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="30.0" y="614.8" width="350" height="159.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
<text x="40.0" y="635.8" font-size="13" font-weight="700" fill="currentColor">Topological sort (Kahn) 拓扑排序 · O(V+E)</text>
<text x="40.0" y="655.0" fill="#374151">Idea: repeatedly pop in-degree-0 nodes 入度为 0; fewer than</text>
<text x="40.0" y="670.5" fill="#374151">V output → cycle</text>
<text x="40.0" y="686.0" fill="#374151">Use: task order, prerequisites 依赖, 'can all be done';</text>
<text x="40.0" y="701.5" fill="#374151">min-heap for lexicographic; peel leaves (310); reverse graph</text>
<text x="40.0" y="717.0" fill="#374151">(802)</text>
<text x="40.0" y="732.5" fill="#374151">Pitfall: edge direction = 'earlier → later', later node's</text>
<text x="40.0" y="748.0" fill="#374151">in-degree +1</text>
<text x="40.0" y="763.5" fill="#374151">LC: 207, 210, 269, 310, 802, 1203</text>
<path d="M436.0,828.5 C408.0,828.5 408.0,844.0 380.0,844.0" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="30.0" y="787.8" width="350" height="112.5" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
<text x="40.0" y="808.8" font-size="13" font-weight="700" fill="currentColor">DAG DP · O(V+E)</text>
<text x="40.0" y="828.0" fill="#374151">Idea: topological order = DP order; one transition line</text>
<text x="40.0" y="843.5" fill="#374151">inside Kahn's loop</text>
<text x="40.0" y="859.0" fill="#374151">Use: longest path, path count, earliest finish on a DAG;</text>
<text x="40.0" y="874.5" fill="#374151">memoized DFS on grids (329)</text>
<text x="40.0" y="890.0" fill="#374151">LC: 1136, 2050, 329, 1857</text>
<path d="M436.0,828.5 C408.0,828.5 408.0,978.2 380.0,978.2" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="30.0" y="914.2" width="350" height="128.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
<text x="40.0" y="935.2" font-size="13" font-weight="700" fill="currentColor">Eulerian path (Hierholzer) 欧拉路径 · O(E)</text>
<text x="40.0" y="954.5" fill="#374151">Idea: DFS deleting edges as used; record node in post-order</text>
<text x="40.0" y="970.0" fill="#374151">后序; reverse</text>
<text x="40.0" y="985.5" fill="#374151">Use: use every edge exactly once 一笔画; itinerary</text>
<text x="40.0" y="1001.0" fill="#374151">reconstruction</text>
<text x="40.0" y="1016.5" fill="#374151">Condition: one node out−in = 1 (start), one in−out = 1 (end)</text>
<text x="40.0" y="1032.0" fill="#374151">LC: 332, 2097</text>
<path d="M746.0,868.5 C716.0,868.5 716.0,1243.5 686.0,1243.5" fill="none" stroke="#4b5563" stroke-width="1.6"/>
<rect x="436.0" y="1219.5" width="250" height="48" rx="24" fill="#4b5563" />
<text x="561.0" y="1248.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Strategy 面试策略</text>
<path d="M436.0,1243.5 C408.0,1243.5 408.0,1132.5 380.0,1132.5" fill="none" stroke="#4b5563" stroke-width="1.6"/>
<rect x="30.0" y="1076.2" width="350" height="112.5" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/>
<text x="40.0" y="1097.2" font-size="13" font-weight="700" fill="currentColor">Three chains 三条主线 (one line apart)</text>
<text x="40.0" y="1116.5" fill="#374151">Shortest path: BFS → 0-1 BFS → Dijkstra → Bellman-Ford →</text>
<text x="40.0" y="1132.0" fill="#374151">Floyd — only the ORDER of relaxing changes</text>
<text x="40.0" y="1147.5" fill="#374151">Tree growing: Dijkstra ↔ Prim — relax d + w vs. w</text>
<text x="40.0" y="1163.0" fill="#374151">Connectivity: DFS/BFS (static) → Union-Find (online) →</text>
<text x="40.0" y="1178.5" fill="#374151">Kruskal → Tarjan</text>
<path d="M436.0,1243.5 C408.0,1243.5 408.0,1251.2 380.0,1251.2" fill="none" stroke="#4b5563" stroke-width="1.6"/>
<rect x="30.0" y="1202.8" width="350" height="97.0" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/>
<text x="40.0" y="1223.8" font-size="13" font-weight="700" fill="currentColor">Answer flow 答题流程 (say it out loud)</text>
<text x="40.0" y="1243.0" fill="#374151">1 define nodes &amp; edges 2 weighted? non-negative? directed?</text>
<text x="40.0" y="1258.5" fill="#374151">3 what is asked</text>
<text x="40.0" y="1274.0" fill="#374151">4 complexity vs. constraints 5 name two pitfalls before</text>
<text x="40.0" y="1289.5" fill="#374151">coding 6 follow-ups ready</text>
<path d="M436.0,1243.5 C408.0,1243.5 408.0,1362.2 380.0,1362.2" fill="none" stroke="#4b5563" stroke-width="1.6"/>
