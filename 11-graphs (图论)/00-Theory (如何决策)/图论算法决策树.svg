<text x="30" y="1058" fill="#6b7280" font-size="11.5">记忆线:BFS → 0-1 BFS → Dijkstra → Bellman-Ford → Floyd 只差“松弛的顺序”;Dijkstra 与 Prim 只差 relax 写 d+w 还是 w;静态连通用 DFS,动态加边用并查集。</text>
