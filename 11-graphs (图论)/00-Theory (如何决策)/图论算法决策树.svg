<rect x="0" y="0" width="1240" height="1074" fill="#ffffff"/>
<text x="620.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">图论算法选择决策树</text>
<text x="620.0" y="52" text-anchor="middle" font-size="12" fill="#6b7280">先问“题目在问什么”,再看附加条件,落到算法;括号里是时间复杂度</text>
